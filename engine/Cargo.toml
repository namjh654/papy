[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/namjh654/papy"
publish = false

[workspace.dependencies]
papy-model = { path = "crates/papy-model" }
papy-render = { path = "crates/papy-render" }
papy-pdf = { path = "crates/papy-pdf" }
papy-hwp = { path = "crates/papy-hwp" }
papy-office = { path = "crates/papy-office" }
papy-core = { path = "crates/papy-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

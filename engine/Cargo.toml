[workspace]
resolver = "3"
members = ["crates/*"]
# 외부 소스(scripts/fetch-*.mjs 로 받음). rhwp 는 자체 [workspace] 를 가지므로 멤버에서 뺀다.
exclude = ["vendor"]

[workspace.package]
version = "0.4.0-rc.1"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/namjh654/papy"
publish = false

[workspace.dependencies]
papy-model = { path = "crates/papy-model" }
papy-render = { path = "crates/papy-render" }
papy-pdf = { path = "crates/papy-pdf" }
papy-hwp = { path = "crates/papy-hwp" }
papy-office = { path = "crates/papy-office" }
papy-core = { path = "crates/papy-core" }
# HWP/HWPX 엔진(MIT). `node scripts/fetch-rhwp.mjs` 로 받는다 — crates.io 에 없고 저장소가 수 GB 라 git 의존성 대신 쓴다.
# 0.9.0 부터 Papy 가 쓰는 HwpDocument(`wasm_api`)는 `wasm-api` 기능 뒤에 있다. PDF 가져오기 등 다른 기본 기능은 끈다.
rhwp = { path = "vendor/rhwp", default-features = false, features = ["wasm-api"] }
# Kotlin·Swift 바인딩 생성(MPL-2.0). 모바일 연결: docs/decisions/0006-mobile-bridge.md
uniffi = "0.32"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# 모바일 라이브러리 크기를 줄인다: 디버그 기호 제거, 크레이트 사이 최적화(LTO)로 쓰지 않는 코드 제거.
# panic 은 unwind 로 둔다 — papy-hwp 가 rhwp 패닉을 catch_unwind 로 오류로 바꾼다.
strip = "symbols"
lto = "fat"
codegen-units = 1

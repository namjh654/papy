[package]
name = "papy-hwp"
description = "Papy HWP/HWPX format adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
papy-model.workspace = true
papy-render.workspace = true
rhwp.workspace = true
papy-office.workspace = true
# rhwp 가 만든 SVG 를 비트맵으로 그린다. usvg 0.45 는 rhwp 가 이미 쓰는 버전과 같다.
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
serde_json = "1"


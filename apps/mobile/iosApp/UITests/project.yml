# iOS UI 테스트 프로젝트 정의 — 생성물(PapyUITests.xcodeproj)도 커밋되어 있어 xcodegen 없이 돈다.
# 바꿀 때만: brew install xcodegen && (cd iosApp/UITests && xcodegen generate)
# 테스트는 설치된 앱을 번들 ID 로 조작한다(앱 프로젝트를 건드리지 않는다). 실행: scripts/orca.sh uitest
name: PapyUITests
options:
  bundleIdPrefix: template.uitests
  deploymentTarget:
    iOS: "17.0"
settings:
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: NO
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
  PapyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Host
    info:
      path: Tests/Info.plist
schemes:
  PapyUITests:
    build:
      targets:
        PapyUITests: [test]
    test:
      targets: [PapyUITests]

# 모든 환경 공통 공개 값 (커밋). 환경 파일(env/<env>.properties)이 같은 키를 덮어쓴다.
# 비밀 값은 여기 두지 않는다 → env/<env>.local.properties (docs/environments.md)

# 앱 이름 — 환경 접미사(app.nameSuffix)가 붙는다: "Papy Dev", "Papy Stg", "Papy"
app.name=Papy

# 앱 버전 — 여기 한 곳에서 올린다(docs/release.md). Android versionName/versionCode, iOS MARKETING_VERSION/CURRENT_PROJECT_VERSION,
# KMP AppConfig.APP_VERSION_NAME(업데이트 확인)에 모두 들어간다. versionCode 는 스토어에 올릴 때마다 1 이상 올린다
app.versionName=0.2.0
app.versionCode=1

# 네트워크 요청 로그 (Authorization 은 가려진다)
network.log=false

# 기능 플래그 예시 — 코드에서는 AppConfig.FEATURE_EXAMPLE 로 읽는다
feature.example=true

# 토큰 재발급 경로(DEC-045, 서버 계약은 가정 DEC-055). 비우면 재발급 없이 401 에서 바로 로그아웃
auth.refreshPath=/api/auth/refresh

# 설정 화면에 현재 환경(dev·staging)을 보여줄지 — prod 는 false
app.showEnvironment=false

# 약관·개인정보 처리방침(웹뷰). 비우면 설정 화면에서 해당 행을 숨긴다
url.terms=https://example.com/terms
url.privacy=https://papy-omega.vercel.app/privacy/

# 로그(Kermit) — 수준: verbose|debug|info|warn|error|none. log.console=false 면 콘솔에 쓰지 않고 크래시 리포터(warn 이상)로만
log.level=info
log.console=true

# 강제·선택 업데이트 확인 경로(가정 — DEC-055). 비우면 확인하지 않는다. iOS 스토어 이동은 store.appStoreId
update.checkPath=/api/app/version
store.appStoreId=

# 소셜 로그인(DEC-105~109) — 키는 env/<env>.local.properties 에(social.kakao.appKey 등). 키가 있는 제공자만 버튼이 보인다
# 애플 로그인은 iOS 에서만, Apple Developer 에서 Sign in with Apple 을 켠 뒤 true (docs/template-setup.md)
social.apple.enabled=false
# SDK 없이 가짜 인증 값으로 흐름 확인(dev 전용, DEC-108). 켜면 플랫폼에 맞는 제공자 버튼이 모두 보인다
social.mock=false
# 메시지 실시간 WebSocket 주소(ws:// · wss://). 비우면 폴링(DEC-126)
chat.websocketUrl=

# 화면 캡처 막기(30-2, DEC-137): true 면 앱 전체 — Android 스크린샷·녹화가 검게 나오고 최근 앱 화면이 가려진다,
# iOS 는 막을 수 없어 화면 녹화·미러링 중에는 내용을 가리고, 스크린샷을 찍으면 안내한다. 앱 잠금을 켜면 최근 앱 화면은 항상 가린다
security.blockCapture=false

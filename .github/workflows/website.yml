name: website

on:
  push:
    branches: [main]
    paths: ["website/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/website.yml"]

permissions:
  contents: read

# 여기서는 빌드만 검증한다. 운영 배포는 Vercel CLI 로 한다(website/README.md "배포").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@papy/website..."
      - run: pnpm --filter @papy/website test

name: release

# v* 태그를 push 하면 Windows·macOS·Linux 설치 파일을 빌드해 GitHub Release 에 올린다.
# 웹사이트 다운로드 페이지(website/download)는 이 Release 의 파일 목록을 읽는다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (예: v0.1.0) — 태그가 없으면 현재 커밋에 만든다"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # 오래된 glibc 에서 빌드해야 AppImage/deb 가 더 많은 배포판에서 돈다.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: rustup target add ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            engine
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-rhwp.mjs
      - run: node scripts/fetch-pdfium.mjs ${{ matrix.target }}
      - run: node scripts/fetch-rhwp-studio.mjs
      - run: node scripts/fetch-fonts.mjs
      - run: node scripts/third-party-notices.mjs
        env:
          PAPY_TARGET: ${{ matrix.target }}
      # 시험판 버전(0.4.0-rc.1 등)은 MSI(Windows)와 RPM(Linux)이 받지 못한다.
      #   MSI: 시험판 꼬리표가 숫자만이어야 함 / RPM: 버전에 '-' 를 쓸 수 없음
      # 그래서 태그에 '-' 가 있으면 Windows 는 NSIS(.exe), Linux 는 deb·AppImage 만 만든다.
      - name: choose bundles
        id: bundles
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          args=""
          if [[ "$TAG" == *-* ]]; then
            case "${{ runner.os }}" in
              Windows) args="--bundles nsis" ;;
              Linux) args="--bundles deb,appimage" ;;
            esac
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      # 코드 서명 없음 — 설치 시 OS 보안 경고 안내는 website/install 참고.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Papy ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            PDF·HWP·HWPX·DOCX·DOC 보기, HWP·HWPX·DOCX·DOC 편집, 저장·형식 변환, PDF 로 내보내기를 할 수 있습니다.
            v0.5.0 시험판: 선택 설치하는 AI 도우미 플러그인. 도구 막대의 ✦ 단추로 대화창을 열고 플러그인을 설치합니다. Claude·ChatGPT·Gemini(내 API 키), Ollama(내 컴퓨터), Claude Code·Codex·Gemini CLI(내 계정)와 문서에 대해 대화하고, 고치기는 제안으로 받아 적용·거절합니다. 다른 AI 앱에서 쓰는 MCP 서버도 들어 있습니다. 그림·각주 바로 뒤 글을 지우면 그 개체까지 지워지던 문제도 고쳤습니다.
            v0.4.1: 앱 아이콘을 웹사이트 로고(흰 문서)와 같게 바꿨습니다.
            v0.4.0 변경: HWP 엔진(rhwp)을 0.9.0 으로 올렸습니다(고급 편집 포함). 한글 문서를 DOCX 로 옮길 때 지문 상자·글상자·바탕쪽·어울림 표·머리 표·그림 자르기가 더 정확해졌고, DOCX 에서 연 문서를 한글 형식으로 저장해도 쪽이 늘지 않습니다. 각주 많은 Word 문서와 큰 표 한글 문서를 훨씬 빨리 엽니다. 한글 ↔ 워드로 저장하기 전과 Word 문서를 열 때, 형식마다 조판 방식이 달라 줄바꿈·쪽 수가 다를 수 있음을 알립니다.
            중요한 문서는 사본으로 써 주세요.
            설치 방법과 보안 경고 해결: https://papy-omega.vercel.app/install/
            코드 서명이 없어 첫 실행 시 OS 보안 경고가 나올 수 있습니다.
          releaseDraft: false
          # v1.0.0-rc.1 처럼 태그에 - 가 있으면 미리보기(pre-release)로 올린다.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          args: --target ${{ matrix.target }} ${{ steps.bundles.outputs.args }}
      # AI 플러그인(ADR 0009): 앱과 따로 받는 실행 파일. 앱은 같은 버전 릴리스에서 받아 서명을 확인한다.
      - name: build AI plugin
        id: ai
        shell: bash
        env:
          PAPY_AI_SIGNING_KEY: ${{ secrets.PAPY_AI_SIGNING_KEY }}
        run: |
          if [ -z "$PAPY_AI_SIGNING_KEY" ]; then
            echo "::warning::PAPY_AI_SIGNING_KEY is not set; the AI plugin is not published"
            exit 0
          fi
          cargo build --release --locked --manifest-path engine/Cargo.toml -p papy-ai --target ${{ matrix.target }}
          exe=papy-ai
          if [ "${{ runner.os }}" = "Windows" ]; then exe=papy-ai.exe; fi
          node scripts/package-ai-plugin.mjs "engine/target/${{ matrix.target }}/release/$exe" ${{ matrix.target }} dist-ai
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: upload AI plugin
        if: steps.ai.outputs.built == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist-ai/* --clobber

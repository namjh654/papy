name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", "rust-toolchain.toml", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "rust-toolchain.toml", ".github/workflows/engine.yml"]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      # rustup 이 rust-toolchain.toml 의 버전을 설치한다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
